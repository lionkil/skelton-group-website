- publication: 142
  heading: How molecules reshape PuO₂
  summary: "Calculations show how water, carbon dioxide and hydrogen peroxide on PuO₂ surfaces change nanoparticle shapes, helping us understand how stored plutonium may evolve."
  image: /assets/images/Moxon-PuO2.png
  width: 1252
  height: 1002
  alt: "Nine triangular diagrams showing possible PuO₂ nanoparticle shapes under different temperatures and combinations of molecules adsorbed on their surfaces."
  caption_title: Predicted shapes of PuO₂ nanoparticles
  caption: "Ternary ‘morphology diagrams’ showing the predicted particle morphology of PuO₂ nanoparticles as a function of the relative areas of the {111} (green), {110} (yellow) and {100} (blue) surfaces. The three vertices represent particles expressing a single surface, the three edges represent particles expressing two surfaces, and the interior represents particles expressing all three surfaces. (A) Range of possible particle morphologies assuming all surface area ratios are accessible. (B–I) Accessible particle morphologies for stoichiometric (F/G) and oxygen deficient particles (B/C/D/E/H/I) at T = 298 (B/D/F/H) and 1000 K (C/E/G/I), in the presence of co-adsorbed H₂O₂/CO₂ (B/C), H₂O/H₂O₂ (D/E), and H₂O/H₂O₂/CO₂ (F/G/H/I) at partial pressures between 10⁻¹² and 1 bar. In (B–I) the accessible morphological space is marked by the shaded grey area. The particle shapes were generated using the Wulff construction, as implemented in the WulffPack Python package."
  summary_source: /assets/images/Moxon_2026_J._Phys.__Condens._Matter_38_075001.pdf

- publication: 146
  heading: Turning waste heat into electricity
  doi: 10.26434/chemrxiv.15006533/v1
  summary: "Modelling predicts that adding sulfur to tin selenide reduces heat flow through the crystal and improves its ability to turn heat into electricity."
  image: /assets/images/Zhang-dispersions.png
  width: 1292
  height: 1178
  alt: "Phonon dispersion and density-of-states plots comparing five models of the Sn(S₀.₂Se₀.₈) alloy."
  caption_title: Vibrations in Sn(S₀.₂Se₀.₈) alloys
  caption: "Unfolded dispersion and density of states (DoS) curves of the five Sn(S₀.₂Se₀.₈) models examined in this work. The dispersion and PDoS of the 32-atom supercell enumeration model are calculated for a formation temperature TF = 900 K. The colour scale on the phonon dispersion plots shows the spectral weight and ranges from blue (small weight) to yellow (large weight). On each DoS plot the total DoS is shown in black and the eigenvector projections onto the S, Se and Sn atoms are shown in red, orange and blue respectively."
  summary_source: /assets/images/chemrxiv.15006533_v1.pdf
